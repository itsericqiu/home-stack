<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Stack</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }
      main {
        width: min(36rem, calc(100vw - 3rem));
      }
      a {
        color: #93c5fd;
      }
      .card {
        border: 1px solid #374151;
        border-radius: 1rem;
        padding: 1.5rem;
        background: #1f2937;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Home Stack</h1>
      <p>Tailnet-only service portal for this stack's local infrastructure.</p>
      <ul id="links"></ul>
      <noscript>Enable JavaScript to see service links.</noscript>
    </main>
    <script>
      // This page is a static fallback with no build step, so service links are
      // derived from our own hostname (portal.<parent-domain>) rather than a
      // baked-in domain that would only be correct for one deployment.
      const parent = location.hostname.replace(/^portal\./, "");
      const services = [
        { sub: "opencode", label: "OpenChamber" },
        { sub: "admin", label: "Admin" },
      ];
      document.getElementById("links").innerHTML = services
        .map(s => `<li><a href="https://${s.sub}.${parent}/">${s.label}</a></li>`)
        .join("");
    </script>
  </body>
</html>
