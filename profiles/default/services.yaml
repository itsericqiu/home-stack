# Starter service registry for a new home-stack profile.
# This file is NEVER auto-loaded; it is copied to profiles/<name>/services.yaml
# by `hs init`. Hosts compose against parent_domain via the `subdomain` field.

services:
  caddy:
    display_name: "Caddy Ingress"
    kind: "ingress"
    type: "system"
    subdomain: "*"
    health:
      port: 443
    # install: tracks `hs upgrade` for the xcaddy-built binary (see
    # docs/RUNBOOK.md "Upgrade Workflow"). `pin` is deployment-specific --
    # set it in your own profile once you've reviewed a Caddy release, not
    # here. `hs upgrade caddy` builds via xcaddy, validates against your
    # generated Caddyfile, and restarts the daemon (needs sudo).
    # install:
    #   method: xcaddy
    #   source: "caddyserver/caddy"
    #   pin: "v2.8.4"
    #   version_cmd: "bin/caddy-cloudflare version"
    #   binary: "bin/caddy-cloudflare"

  admin:
    display_name: "Home Stack Admin"
    kind: "control"
    # lifecycle controls what the admin webapp may do to a service:
    #   managed  — home-stack owns the launchd plist; start/stop/restart allowed
    #   external — home-stack only provides the Caddy route; no operations
    #   custom   — user-supplied plist; route-only for now
    lifecycle: managed
    type: "proxy"
    upstream: "127.0.0.1:31510"
    subdomain: admin
    # auth gates this route at the ingress. One of:
    #   none           — ungated (the default when the field is absent)
    #   tailnet        — zero-click; resolves the caller's Tailscale identity
    #   sso            — defers to the tinyauth broker's login
    #   tailnet-or-sso — tailnet first, broker for anything off-tailnet
    # Only meaningful for a routed service: auth cannot protect a loopback-only
    # upstream, and setting it on one is rejected rather than silently ignored.
    # See docs/SERVICE_INTERFACE.md.
    auth: none
    health:
      port: 31510
      http_url: "http://127.0.0.1:31510/api/health"

  # Identity layer. Uncomment both to run self-hosted SSO; see docs/RUNBOOK.md
  # for installing the pocket-id binary and building tinyauth from source.
  # Both stay `auth: none` deliberately -- they ARE the login path, so gating
  # them behind the broker they serve would deadlock it.
  #
  # pocket-id:
  #   display_name: "Pocket ID"
  #   kind: "auth"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "127.0.0.1:31520"
  #   subdomain: id
  #   auth: none
  #   health:
  #     port: 31520
  #     http_url: "http://127.0.0.1:31520/healthz"
  #   # install: pocket-id ships prebuilt GitHub release binaries -- see
  #   # docs/RUNBOOK.md "Install Pocket ID". {version}/{arch} in `asset` are
  #   # substituted by `hs upgrade` (version without a leading "v"; arch is
  #   # arm64 or amd64 from uname).
  #   install:
  #     method: github-release
  #     source: "pocket-id/pocket-id"
  #     pin: "v1.9.0"
  #     version_cmd: "pocket-id --version"
  #     asset: "pocket-id_darwin_{arch}"
  #     binary: "bin/pocket-id"
  #
  # tinyauth:
  #   display_name: "Tinyauth Broker"
  #   kind: "auth"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "127.0.0.1:31521"
  #   subdomain: auth
  #   auth: none
  #   health:
  #     port: 31521
  #     http_url: "http://127.0.0.1:31521/healthz"
  #   # install: upstream ships Linux binaries only, so this is built from
  #   # source -- see docs/RUNBOOK.md "Build tinyauth". `hs upgrade tinyauth`
  #   # clones the pinned tag, builds the frontend with corepack pnpm, then
  #   # `go build`s the same way the RUNBOOK recipe does.
  #   install:
  #     method: source-go
  #     source: "tinyauthapp/tinyauth"
  #     pin: "v5.1.3"
  #     version_cmd: "bin/tinyauth --version"
  #     binary: "bin/tinyauth"

  # Example service entries below. None of these ship a binary — each is
  # the operator's to build or install; uncomment and adjust once you have
  # it. See docs/SERVICE_INTERFACE.md for the full contract.
  #
  # Hermes: an externally-built agent app that home-stack only supervises
  # and routes. Its Host/Origin rebinding guard requires `proxy_identity:
  # upstream`, and — because pure-data registries never interpolate
  # HOME_STACK_TAILNET_IP — the upstream below must be the profile's literal
  # Tailnet IP, not loopback.
  # hermes:
  #   display_name: "Hermes Agent"
  #   kind: "agent"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "100.64.0.8:31511"
  #   proxy_identity: upstream
  #   subdomain: hermes
  #   auth: tailnet
  #   health:
  #     port: 31511
  #     http_url: "https://hermes.home.example.com/api/status"
  #   # install: Hermes is commit-pinned, never a moving tag -- see
  #   # docs/RUNBOOK.md "Hermes (commit-pinned only)". `hs upgrade hermes`
  #   # refuses anything but a full 40-char commit SHA via --to, and needs
  #   # --yes since it mutates ~/.hermes (config backup, pinned installer,
  #   # web/pty extras, config check, restart, /api/status verification).
  #   install:
  #     method: hermes-pinned
  #     source: "NousResearch/hermes-agent"
  #     pin: "3f9a1c2e5b7d0648a19cfe2d6b4a8f01c3e5d7a9"
  #     version_cmd: "git -C ~/.hermes/hermes-agent rev-parse HEAD"
  #
  # OpenCode: an internal backend with no Caddy route of its own — only
  # OpenChamber (below) proxies to it directly, so it has no `subdomain`.
  # opencode:
  #   display_name: "OpenCode"
  #   kind: "backend"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "127.0.0.1:31496"
  #   health:
  #     port: 31496
  #   # install: the opencode CLI ships its own self-updater. `hs upgrade
  #   # opencode` runs `opencode upgrade` (with a version argument only if
  #   # the installed CLI documents one); `source` here is the npm package
  #   # `hs upgrade status` checks for the latest published version.
  #   install:
  #     method: opencode
  #     source: "opencode-ai"
  #     version_cmd: "opencode --version"
  #
  # OpenChamber: the web UI in front of OpenCode, routed at its own
  # subdomain.
  # openchamber:
  #   display_name: "OpenChamber"
  #   kind: "proxy"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "127.0.0.1:31497"
  #   subdomain: opencode
  #   health:
  #     port: 31497
  #   # install: an npm-global package. `hs upgrade openchamber` runs
  #   # `npm install -g <source>@<version>`, restarts, and health-checks.
  #   install:
  #     method: npm-global
  #     source: "openchamber"
  #     version_cmd: "openchamber --version"
  #
  # Dev gateway: a wildcard dev-host proxy for local development domains.
  # The binary builds from portable/home-stack/dev-gateway; left disabled
  # by default since most operators don't need it.
  # dev-gateway:
  #   display_name: "Dev Gateway"
  #   kind: "ingress"
  #   lifecycle: managed
  #   type: "proxy"
  #   upstream: "127.0.0.1:31500"
  #   subdomain: "*.dev"
  #   auth: tailnet
  #   enabled: false
  #   health:
  #     port: 31500

  # Portal. The service MUST be named `portal`: the engine attaches the two
  # sanitized projection routes (/.well-known/home-stack/catalog.json and
  # status.json) to this name and no other. `root` is either the fallback page
  # shipped in this repo or the built home-portal PWA
  # (https://github.com/itsericqiu/home-portal, `dist/` after `npm run build`).
  #
  # portal:
  #   display_name: "Portal"
  #   kind: "static"
  #   type: "static"
  #   subdomain: portal
  #   root: "~/github/home-stack/portable/home-stack/portal-www"   # or ~/github/home-portal/dist
  #   health:
  #     http_url: "https://portal.home.example.com/"
